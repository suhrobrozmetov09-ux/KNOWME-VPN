name: Build iOS IPA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Compile and Build IPA with Real Icon
        run: |
          mkdir -p App/Payload/KNOWME-VPN.app
          
          # Ilovani kompilyatsiya qilish
          swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -target arm64-apple-ios15.0 \
                 -Xfrontend -serialize-debugging-options \
                 -emit-executable \
                 main.swift ContentView.swift \
                 -o App/Payload/KNOWME-VPN.app/KNOWME-VPN
          
          # Foydalanuvchi yuklagan icon.png rasmini Apple ikonka formatiga o'tkazish
          if [ -f "icon.png" ]; then
            sudo sips -z 180 180 icon.png --out App/Payload/KNOWME-VPN.app/AppIcon60x60@3x.png
            sudo sips -z 120 120 icon.png --out App/Payload/KNOWME-VPN.app/AppIcon60x60@2x.png
          fi
          
          # Info.plist sozlamalari
          cat <<EOF > App/Payload/KNOWME-VPN.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>KNOWME-VPN</string>
              <key>CFBundleIdentifier</key>
              <string>com.knowme.vpn.pubg</string>
              <key>CFBundleName</key>
              <string>KNOWME VPN</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                      </array>
                  </dict>
              </dict>
          </dict>
          </plist>
          EOF
          
          cd App && zip -r ../KNOWME-VPN.ipa Payload/
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KNOWME-VPN-Package
          path: KNOWME-VPN.ipa
